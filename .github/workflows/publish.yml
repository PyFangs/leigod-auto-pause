name: Publish tested Windows package
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          package="dist/leigod-auto-pause-$tag-win-x64.zip"
          sha256sum -c dist/SHA256SUMS
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This version is already published."
            exit 0
          fi
          gh release create "$tag" "$package" dist/SHA256SUMS --target "$GITHUB_SHA" --title "雷神自动暂停助手 $tag" --notes-file docs/release-notes.md --latest
